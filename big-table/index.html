<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Big Table</title>

<style>
/* Layout: the bedroom fills the screen; a huge wooden table fills the foreground with toys on top; a small caption card sits top-left. */
:root{
  --wall:#bfe0f0; --wall-stripe:#a9d3e8; --wainscot:#f2c6d4; --floor:#d9a86c; --floor-line:#c08f55;
  --sky:#8fd0f5; --glow:#ffd45e; --curtain:#ef8a7a; --rug:#7fc8a9; --rug2:#fff1b8;
  --bed:#6fa3d8; --bed2:#ffffff; --wood:#b9824a; --toy1:#ef6f6c; --toy2:#ffd45e; --toy3:#5cc2a0; --line:#d6dff0;
  --top:#e3a566; --top-hi:#f0bd85; --top-edge:#b87a3e; --leg:#a56a35; --leg-dark:#8a5428; --shadow:rgba(40,25,10,.28);
  --panel:rgba(255,255,255,.93); --fg:#26324a; --muted:#5d6b86; --accent:#ef6f6c;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#1f2850; --wall-stripe:#252f5e; --wainscot:#4a3560; --floor:#3b2f4c; --floor-line:#2f253d;
  --sky:#0f1a3d; --glow:#fff1b0; --curtain:#8a4a74; --rug:#2f6f67; --rug2:#5b5a86;
  --bed:#3f5fa0; --bed2:#aab6dd; --wood:#6a4a3a; --toy1:#c9585a; --toy2:#e8c04a; --toy3:#3da184; --line:#36406e;
  --top:#8a6044; --top-hi:#a37656; --top-edge:#5e3f2b; --leg:#6e4a33; --leg-dark:#563925; --shadow:rgba(0,0,0,.4);
  --panel:rgba(22,27,52,.92); --fg:#e8ecfa; --muted:#a3aed0; --accent:#ff8a85; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#1f2850; --wall-stripe:#252f5e; --wainscot:#4a3560; --floor:#3b2f4c; --floor-line:#2f253d;
  --sky:#0f1a3d; --glow:#fff1b0; --curtain:#8a4a74; --rug:#2f6f67; --rug2:#5b5a86;
  --bed:#3f5fa0; --bed2:#aab6dd; --wood:#6a4a3a; --toy1:#c9585a; --toy2:#e8c04a; --toy3:#3da184; --line:#36406e;
  --top:#8a6044; --top-hi:#a37656; --top-edge:#5e3f2b; --leg:#6e4a33; --leg-dark:#563925; --shadow:rgba(0,0,0,.4);
  --panel:rgba(22,27,52,.92); --fg:#e8ecfa; --muted:#a3aed0; --accent:#ff8a85; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--fg);font-family:var(--font-body);min-height:100vh;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#room{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{position:relative;z-index:1;display:inline-flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:100%}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,5vw,3rem);line-height:1;background:var(--panel);padding:10px 20px 12px;border-radius:18px 18px 18px 4px}
h1 small{display:block;font-family:var(--font-body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;background:var(--panel);color:var(--fg);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent)}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="card">
  <h1>Big Table<small>Seats the whole stuffed-animal family</small></h1>
  <button id="themeBtn" type="button">Switch to night</button>
</div>
<script>
(function(){
  var btn=document.getElementById("themeBtn"),root=document.documentElement;
  function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
  function label(){btn.textContent=isDark()?"Switch to day":"Switch to night"}
  btn.onclick=function(){root.setAttribute("data-theme",isDark()?"light":"dark");label()};label();
})();
</script>

</body></html>
