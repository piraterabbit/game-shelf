<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Shelf</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#1a1e26;--hi:#252b36;--fg:#e8ecf4;--mut:#8d97aa;--acc:#ffb84d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:32px 16px 48px}
main{max-width:960px;margin:0 auto}
h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 4px}
p{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid #2b3240;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:background .15s,transform .15s}
.card:hover,.card:focus-visible{background:var(--hi);transform:translateY(-3px);outline:none;border-color:var(--acc)}
.thumb{position:relative;display:block;aspect-ratio:8/5;background:#0b0d11}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tag{position:absolute;top:8px;right:8px;background:rgba(15,17,21,.8)}
.t{font-weight:600;padding:12px 14px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:#2b3240;color:var(--mut)}
.thumb .tag.3d{background:var(--acc);color:#1a1200}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><main>
<h1>Game Shelf</h1><p>10 games</p>
<div class="grid">
    <a class="card" href="boom-and-box/"><span class="thumb"><img src="thumbs/boom-and-box.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Boom and Box</span></a>
    <a class="card" href="brick-baron/"><span class="thumb"><img src="thumbs/brick-baron.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Brick Baron</span></a>
    <a class="card" href="cubinia/"><span class="thumb"><img src="thumbs/cubinia.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 2d">2D</span></span><span class="t">Cubinia</span></a>
    <a class="card" href="ferris-jimmy/"><span class="thumb"><img src="thumbs/ferris-jimmy.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Ferris Jimmy</span></a>
    <a class="card" href="find-the-muffins/"><span class="thumb"><img src="thumbs/find-the-muffins.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Find the Muffins</span></a>
    <a class="card" href="hollow-brew/"><span class="thumb"><img src="thumbs/hollow-brew.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Hollow Brew</span></a>
    <a class="card" href="maple-hollow/"><span class="thumb"><img src="thumbs/maple-hollow.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Maple Hollow</span></a>
    <a class="card" href="paintfall/"><span class="thumb"><img src="thumbs/paintfall.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Paintfall</span></a>
    <a class="card" href="paintfall-karting/"><span class="thumb"><img src="thumbs/paintfall-karting.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">PaintFall Karting</span></a>
    <a class="card" href="wyrmhold/"><span class="thumb"><img src="thumbs/wyrmhold.jpg" alt="" loading="lazy" width="480" height="300"><span class="tag 3d">3D</span></span><span class="t">Wyrmhold</span></a>
</div></main></body></html>
