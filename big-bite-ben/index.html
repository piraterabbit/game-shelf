/* One card on a quiet sage table: the card is the page; a short label sits under it like a gallery caption. */
:root {
  --bg: #eef3ea;
  --surface: #ffffff;
  --ink: #2c3a30;
  --muted: #5f6e63;
  --accent: #e2557f;
  --line: #d5e0cf;
  --display: 'M PLUS Rounded 1c', ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #18201b; --surface: #222c25; --ink: #e6efe7; --muted: #a7b6ab; --accent: #ff7fa3; --line: #34423a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #18201b; --surface: #222c25; --ink: #e6efe7; --muted: #a7b6ab; --accent: #ff7fa3; --line: #34423a; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
main {
  min-height: 100%;
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 18px;
  padding-block: 32px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: min(100%, 360px);
  aspect-ratio: 320 / 483;
  max-width: 100%;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 18px 40px -22px rgba(30, 50, 35, .45), 0 2px 6px rgba(30, 50, 35, .08);
}
.card svg { display: block; width: 100%; height: 100%; }
.label { width: min(100%, 360px); display: grid; gap: 6px; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; text-wrap: balance; }
.meta { margin: 0; font-size: .82rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { margin: 4px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: .92rem; line-height: 1.45; color: var(--muted); }
.note b { color: var(--ink); }
