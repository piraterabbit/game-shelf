<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed 3D island, slim HUD on top, a single context panel docked right (bottom sheet on phones). */
:root{
  --ink:#0f0b0e; --ash:#1a1316; --char:#271d21; --line:#4b3a3c;
  --bone:#eadfcb; --dim:#ab9a8c; --gold:#f2c14e; --ember:#ff6a2b;
  --moss:#8cc06c; --blood:#e0503f; --ice:#6cc7e6; --viol:#b08cff;
  --display:'Metamorphous','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --pad-l:max(16px,env(safe-area-inset-left,0px));
  --pad-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font:17px/1.35 var(--body);overflow:hidden;font-variant-numeric:tabular-nums lining-nums;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.pointer{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px var(--pad-r) 0 var(--pad-l);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;pointer-events:none;z-index:5}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 12px #000a;margin-right:6px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#140e11d9;border:1px solid var(--line);border-radius:4px;padding:5px 12px 6px;min-width:84px;backdrop-filter:blur(6px)}
.chip b{display:block;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.chip span{font-size:22px;font-weight:700;line-height:1.15}
.chip em{font-style:normal;font-size:13px;color:var(--dim);margin-left:6px}
.chip.gold span{color:var(--gold)} .chip.meat span{color:#ff9d7a}
.chip.neg em{color:var(--blood)}
.rank{margin-left:auto;min-width:200px;background:#140e11d9;border:1px solid var(--line);border-radius:4px;padding:5px 12px 8px;backdrop-filter:blur(6px)}
.rank b{display:block;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.rank span{font-family:var(--display);font-size:17px;color:var(--bone)}
.bar{height:6px;background:#0008;border-radius:3px;overflow:hidden;margin-top:6px;border:1px solid #ffffff10}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--gold));transition:width .3s}

#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translateX(-50%);z-index:6;display:flex;gap:14px;align-items:center;background:#3a1210ee;border:1px solid var(--blood);border-radius:4px;padding:8px 10px 8px 16px;box-shadow:0 0 28px #e0503f55;animation:pulse 1.4s ease-in-out infinite;max-width:calc(100% - 32px)}
#banner strong{font-family:var(--display);font-weight:400;color:#ffb3a6}
@keyframes pulse{50%{box-shadow:0 0 38px #e0503f99}}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 118px);bottom:max(16px,env(safe-area-inset-bottom,0px));width:336px;overflow-y:auto;background:#150f12ea;border:1px solid var(--line);border-radius:6px;padding:14px 16px 18px;z-index:5;touch-action:pan-y;backdrop-filter:blur(8px);scrollbar-width:thin;scrollbar-color:var(--line) transparent;-webkit-user-select:none;user-select:none}
#panel h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;color:var(--gold);line-height:1.2;text-wrap:balance}
#panel h3{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#panel p{margin:6px 0;color:#cdbfae}
.sub{font-size:14px;color:var(--dim)}
.head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.x{background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:30px;line-height:1;font-size:18px;color:var(--dim);flex:none}
.x:hover{color:var(--bone);border-color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid #ffffff0d}
.kv span:first-child{color:var(--dim)}
.btn{display:block;width:100%;text-align:left;background:var(--char);border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-top:8px}
.btn:hover:not(:disabled){border-color:var(--gold);background:#33262a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:linear-gradient(180deg,#f2c14e,#d99a2b);color:#2a1a05;border-color:#f6d98a;font-weight:700;text-align:center}
.btn.go:hover:not(:disabled){background:linear-gradient(180deg,#ffd266,#e5a52f);border-color:#fff1c2}
.btn small{display:block;color:var(--dim);font-size:14px;font-weight:400;margin-top:1px}
.btn.go small{color:#5b3d10}
.btn .c{float:right;color:var(--gold);font-weight:700}
.btn .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:0}
.drow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #ffffff0d;padding:7px 2px}
.drow:hover{background:#ffffff08}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.drow .n{flex:1;min-width:0}
.drow .n small{display:block;color:var(--dim);font-size:14px}
.drow .r{color:var(--gold);font-weight:700}
.tag{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px}
.warn{color:var(--blood)}
.fine{font-size:14px;color:var(--dim)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;padding:0;margin-top:14px;font-size:14px}

#toasts{position:fixed;left:var(--pad-l);bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none;max-width:min(420px,calc(100% - 32px))}
.toast{background:#150f12ee;border-left:3px solid var(--gold);padding:7px 12px;border-radius:3px;animation:in .25s ease-out;box-shadow:0 4px 18px #0009}
.toast.bad{border-color:var(--blood)} .toast.rare{border-color:var(--viol)} .toast.good{border-color:var(--moss)}
@keyframes in{from{transform:translateX(-12px);opacity:0}}
.float{position:fixed;pointer-events:none;z-index:7;font-weight:700;font-size:20px;color:var(--gold);text-shadow:0 2px 6px #000,0 0 12px #000a;animation:rise 1.2s ease-out forwards;transform:translate(-50%,-50%)}
.float.red{color:var(--blood)} .float.big{font-size:26px}
@keyframes rise{to{transform:translate(-50%,-90px);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 40%,#e0503fcc);opacity:0}
#flash.on{animation:fl .8s ease-out}
@keyframes fl{from{opacity:1}to{opacity:0}}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--ink);z-index:20;font-size:18px}

#panel .drow.on{border-left:3px solid var(--gold);background:#ffffff0c;padding-left:8px}
.vlabel{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:15px;line-height:1.15;text-shadow:0 1px 5px #000,0 0 10px #000;color:var(--bone);white-space:nowrap}
.vlabel small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blood)}
.vlabel.won small{color:var(--moss)}
#decree{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:9;text-align:center;pointer-events:none;opacity:0;max-width:min(520px,calc(100% - 32px));padding:22px 28px;background:#150f12f2;border:1px solid var(--gold);border-radius:6px;box-shadow:0 0 60px #f2c14e55}
#decree h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0 0 8px;color:var(--gold)}
#decree p{margin:0;color:var(--bone)}
#decree.on{animation:decree 8s ease-in-out forwards}
@keyframes decree{0%{opacity:0;transform:translate(-50%,-44%)}8%,85%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}
@media (max-width:760px){
  .brand{font-size:21px} .chip{min-width:0;padding:4px 9px 5px} .chip span{font-size:18px} .chip em{display:none}
  .rank{margin-left:0;min-width:0;flex:1 1 100%}
  .brand small{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:42vh;border-radius:10px 10px 0 0;border-width:1px 0 0;padding:12px var(--pad-r) max(16px,env(safe-area-inset-bottom,0px)) var(--pad-l)}
  #banner{top:auto;bottom:calc(42vh + 12px)}
  #toasts{bottom:calc(42vh + 70px)}
}
@media (prefers-reduced-motion:reduce){#banner{animation:none}}
</style>

<canvas id="c" aria-label="Floating volcanic island with your dragon lair"></canvas>
<header id="hud">

  <div class="chips">
    <div class="chip gold"><b>Gold</b><span id="hGold">0</span><em id="hInc"></em></div>
    <div class="chip meat" id="chipMeat"><b>Fed</b><span id="hMeat">0</span><em id="hMeatR"></em></div>

</header>

<div id="toasts"></div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
function fmt(n){n=Math.floor(n);if(n<10000)return n.toLocaleString('en-US');const u=['','k','M','B','T','Q'];let i=0,v=n;while(v>=1000&&i<5){v/=1000;i++}return (v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+u[i]}
const f1=n=>n.toFixed(1);

/* ------------------------------------------------------------------ data */
const GRID=7,MID=3,TILE=2.4,HOARD=GRID*MID+MID;
const SPECIES=[
  {id:'ember',n:'Ember',m:1,  w:30, g:0,  col:0xc8402a,belly:0xf0a04b,glow:0xff5a1f,css:'#ff6a2b'},
  {id:'frost',n:'Frost',m:1.5,w:14, g:.3, col:0x58b4d6,belly:0xe2f6ff,glow:0x6cc7e6,css:'#6cc7e6'},
  {id:'storm',n:'Storm',m:2.4,w:6,  g:.6, col:0xe2b72c,belly:0xfff1a8,glow:0xffd84a,css:'#f2c14e'},
  {id:'void', n:'Void', m:4,  w:1.5,g:1,  col:0x5a2c8c,belly:0xb88cff,glow:0x9a5cff,css:'#b08cff'},
  {id:'moss', n:'Moss', m:1.2,w:24, g:0,  col:0x4f8f47,belly:0xc5d98a,glow:0x8cc06c,css:'#8cc06c',feat:'horns'},
  {id:'dune', n:'Dune', m:1.3,w:18, g:0,  col:0xc99a5a,belly:0xf0dcae,glow:0xe0b070,css:'#e0b070',feat:'spines'},
  {id:'tide', n:'Tide', m:1.9,w:9,  g:.3, col:0x2a6fb0,belly:0x9fd6e8,glow:0x3fa0e0,css:'#4a9fe0',feat:'fins'},
  {id:'crystal',n:'Crystal',m:3,w:3,g:.8, col:0xd470b8,belly:0xffd6f2,glow:0xff7ad8,css:'#ff7ad8',feat:'crystal',eye:0xffffff},
  {id:'bone', n:'Bone', m:5,  w:1,  g:1.2,col:0xd9d0bb,belly:0x8c8272,glow:0xffffff,css:'#e6dcc4',feat:'horns',eye:0x7dffb0},
  {id:'eclipse',n:'Eclipse',m:7,w:.4,g:1.5,col:0x1c1722,belly:0x3a2f4a,glow:0xf2c14e,css:'#f2c14e',feat:'crystal',eye:0xffc84a}
];
const RARE=2.4;
function odds(l){const w=SPECIES.map(x=>x.w*(1+(l-1)*x.g)),t=w.reduce((a,b)=>a+b,0);return w.map(x=>x/t*100)}
const rareChance=l=>odds(l).reduce((a,o,i)=>a+(SPECIES[i].m>=RARE?o:0),0);
const STAGES=[{n:'Hatchling',m:.5,eat:.8,s:.36,at:0},{n:'Drake',m:1.2,eat:1.5,s:.56,at:60},{n:'Elder',m:3,eat:2.5,s:.8,at:240}];
const MAXLVL=5;
const CORE=[];for(let r=MID-1;r<=MID+1;r++)for(let c=MID-1;c<=MID+1;c++)CORE.push(r*GRID+c);
const STAGEPOW=[0,1.5,4];
const VIL=[
  {name:'Thistledown',   def:3,  loot:250,  trib:2,  unl:[2,10,14],ang:20, r:15.5},
  {name:'Marrow Ford',   def:8,  loot:700,  trib:5,  unl:[22,1,3], ang:80, r:16},
  {name:'Saltmere',      def:18, loot:1800, trib:12, unl:[21,23,5],ang:140,r:16.5},
  {name:'Greywatch',     def:40, loot:5000, trib:30, unl:[9,15,19],ang:200,r:16},
  {name:'Castle Valmont',def:90, loot:14000,trib:70, unl:[0,4,20], ang:260,r:16.5},
  {name:'Crown Citadel', def:200,loot:40000,trib:160,unl:[24],     ang:320,r:17}
];
const vdef=i=>VIL[i].def*(S.vil[i].rebel?.6:1);
const vloot=i=>Math.round(VIL[i].loot*(S.vil[i].rebel?.4:1));
const pw=d=>SPECIES[d.sp].m*STAGEPOW[stageOf(d)];
const winChance=(p,def)=>clamp((p/def-.35)/.9,.03,.98);
const oddsLabel=p=>p<.25?'Hopeless':p<.55?'Risky':p<.85?'Likely':'Overwhelming';
const BUILD={
  roost:   {name:'Roost',     base:100,col:'#b0793f',desc:'Houses 2 dragons. Upgrades boost their gold.'},
  hatchery:{name:'Hatchery',  base:200,col:'#c0503a',desc:'Incubates dragon eggs. Upgrades hatch faster and find rarer species.'},
  pasture: {name:'Pasture',   base:60, col:'#8cc06c',desc:'Sheep to feed your dragons. Each pasture feeds 5 dragons, and upgrades add one more each.'},
  mine:    {name:'Gold mine', base:140,col:'#a99bb8',desc:'Dwarf-free mining. Steady gold, no dragons needed.'},
  treasury:{name:'Treasury',  base:350,col:'#f2c14e',desc:'Counting house that multiplies every coin you earn.'},
  tower:   {name:'Watchtower',base:260,col:'#8a8f99',desc:'Archers shoot at knights before they reach the hoard.'}
};
const RANKS=[[0,'Cave Squatter'],[1500,'Village Pest'],[12000,"Baron's Bane"],[100000,'Terror of the Realm'],[1000000,'Dragon Emperor']];
const NAMES_A=['Ash','Cinder','Vex','Orm','Skarn','Thrax','Nym','Brand','Kael','Zeph','Mor','Sable','Grim','Ily','Tor','Embra'];
const NAMES_B=['ador','ith','ax','wyrm','aura','gar','ion','eth','ok','yss','aal','ine'];

/* ------------------------------------------------------------------ state */
const KEY='wyrmhold-v1';
let uid=1;
function freshState(){
  const s={gold:180,meat:60,total:0,eggs:0,kills:0,t:0,knightIn:75,ts:Date.now(),
    tiles:Array(GRID*GRID).fill(null),dragons:[],vil:VIL.map(()=>({won:false,cd:0})),raids:[],land:[]};
  const R0=(MID-1)*GRID+MID-1;
  s.tiles[R0]={type:'roost',lvl:1};
  s.tiles[R0+2]={type:'pasture',lvl:1};
  s.dragons.push({id:uid++,name:'Cinder',sp:0,age:20,roost:R0});s.seen=[0];
  return s;
}
let S;
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.tiles&&(o.tiles.length===25||o.tiles.length===GRID*GRID)&&Array.isArray(o.dragons)){S=o;uid=1+Math.max(0,...S.dragons.map(d=>d.id))}}}catch(e){}
if(!S)S=freshState();
if(!S.seen)S.seen=[...new Set(S.dragons.map(d=>d.sp))];
if(!S.vil||S.vil.length!==VIL.length)S.vil=VIL.map(()=>({won:false,cd:0}));
if(!S.raids)S.raids=[];
if(!S.land){S.land=[];S.vil.forEach((v,k)=>{if(v.won)S.land.push(...VIL[k].unl)})}
if(S.tiles.length===25){// older saves used a 5x5 grid; move them into the middle of the 7x7 one
  const m5=i=>(Math.floor(i/5)+1)*GRID+(i%5)+1,nt=Array(GRID*GRID).fill(null);
  S.tiles.forEach((t,i)=>{if(t)nt[m5(i)]=t});S.tiles=nt;S.dragons.forEach(d=>{d.roost=m5(d.roost)});S.land=S.land.map(m5)}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ------------------------------------------------------------------ economy */
const stageOf=d=>d.age<STAGES[1].at?0:d.age<STAGES[2].at?1:2;
const lvlSum=t=>S.tiles.reduce((a,x)=>a+(x&&x.type===t?x.lvl:0),0);
const count=t=>S.tiles.filter(x=>x&&x.type===t).length;
const hatchTime=l=>Math.round(22/(1+.25*(l-1)));
const treasuryMult=()=>1+.15*lvlSum('treasury');
const feedCap=()=>S.tiles.reduce((a,t)=>a+(t&&t.type==='pasture'?4+t.lvl:0),0);
const eggCost=()=>Math.round(80*Math.pow(1.45,S.dragons.length+eggsInProgress()));
const eggsInProgress=()=>S.tiles.filter(x=>x&&x.egg).length;
const roostIdx=()=>S.tiles.map((t,i)=>t&&t.type==='roost'?i:-1).filter(i=>i>=0);
const freeSlots=()=>roostIdx().length*2-S.dragons.length-eggsInProgress();
const buildCost=t=>Math.round(BUILD[t].base*Math.pow(1.35,count(t)));
const upCost=(t,l)=>Math.round(BUILD[t].base*Math.pow(1.8,l));
const raidOf=id=>S.raids.find(r=>r.ids.includes(id));
const LAND_ORDER=Array.from({length:GRID*GRID},(_,i)=>i).filter(i=>!CORE.includes(i)).sort((a,b)=>{const d=i=>Math.hypot(i%GRID-MID,Math.floor(i/GRID)-MID);return d(a)-d(b)||a-b});
const isOpen=i=>CORE.includes(i)||!!S.tiles[i]||S.land.includes(i);
// Each village captured grants one more plot than the last: 1, then 2, then 3, and so on (limited by the land left).
const landGain=()=>Math.min(LAND_ORDER.filter(i=>!isOpen(i)).length,S.vil.filter(v=>v.won).length+1);
function rankIdx(){let r=0;RANKS.forEach((x,i)=>{if(S.total>=x[0])r=i});return r}
function calc(){
  const tm=treasuryMult();let gold=0,eat=0,ix=0;const cap=feedCap(),fedIds=new Set(),fed=1;
  const per=new Map();
  for(const d of S.dragons){
    const st=STAGES[stageOf(d)];const rt=S.tiles[d.roost];const rl=rt?rt.lvl:1;
    const ok=ix++<cap;if(ok)fedIds.add(d.id);const fed=ok?1:.35;const busy=d.hurt>0||raidOf(d.id);const inc=busy?0:4*SPECIES[d.sp].m*st.m*(1+.25*(rl-1))*tm*fed;
    per.set(d.id,inc);gold+=inc;eat+=st.eat;
  }
  let mineG=0,meatIn=0;
  for(const t of S.tiles){if(!t)continue;if(t.type==='mine')mineG+=4*t.lvl*tm;if(t.type==='pasture')meatIn+=2.2*t.lvl}
  let trib=0;S.vil.forEach((v,i)=>{if(v.won&&!v.rebel)trib+=VIL[i].trib*tm});
  return{gold:gold+mineG+trib,dragonGold:gold,mine:mineG,trib,cap,fedIds,per};
}
function away(sec){

  for(let i=0;i<NP;i++){

    pL[i]-=dt;const k=Math.max(0,pL[i]/pM[i]),i3=i*3;
    pV[i3+1]+=pG[i]*dt;pP[i3]+=pV[i3]*dt;pP[i3+1]+=pV[i3+1]*dt;pP[i3+2]+=pV[i3+2]*dt;
    if(pK[i]===0){pA[i]=Math.min(1,k*1.6);pSz[i]=pS0[i]*(.5+(1-k)*.9);const f=.35+.65*k;pC[i3]=pB[i3]*f;pC[i3+1]=pB[i3+1]*f*f;pC[i3+2]=pB[i3+2]*f*f}
    else{pA[i]=Math.sin(k*3.14)*.8;pSz[i]=pS0[i];pC[i3]=pB[i3];pC[i3+1]=pB[i3+1];pC[i3+2]=pB[i3+2]}
  }

    st.won=true;st.t0=S.t;st.cd=0;S.gold+=v.loot;S.total+=v.loot;refreshLand();refreshVillage(r.v);
    toast(`${v.name} has fallen. +${fmt(v.loot)} gold${fresh.length?` and ${fresh.length} new plot${fresh.length>1?'s':''} of land`:''}.`,'rare');
    floatAt('+'+fmt(v.loot),wp.clone().setY(3),'big');burst(wp,60,1,.7,.2,3.5,.45,1.2);
    fresh.forEach(i=>{const p=tilePos(i);burst(new THREE.Vector3(p.x,.5,p.z),26,.6,1,.5,2.4,.4,1)});
  }else{r.lost=true;toast(`${st.rebel?'The rebels':v.name+'\'s defenders'} drove the raid off. Your dragons limp home.`,'bad')}
}
function stepRaids(dt){
  for(let i=S.raids.length-1;i>=0;i--){const r=S.raids[i];r.t+=dt;
    if(!r.done&&r.t>=r.dur*.62){resolveRaid(r);renderPanel()}
    if(r.t>=r.dur){if(r.lost)r.ids.forEach(id=>{const d=S.dragons.find(x=>x.id===id);if(d)d.hurt=45});S.raids.splice(i,1);renderPanel();save()}}
  for(const d of S.dragons)if(d.hurt>0)d.hurt-=dt;
  for(const v of S.vil)if(v.cd>0)v.cd-=dt;
}
function doPat(){
  const d=S.dragons.find(x=>x.id===sel.id);if(!d)return;patDragon(d);
}
function patDragon(d){
  const v=patValue(d);S.gold+=v;S.total+=v;const D=dragons.get(d.id);
  if(D){const p=D.m.g.position.clone();p.y+=1.2*D.cur;floatAt('+'+fmt(v),p,'');burst(p,6,1,.8,.3,1.2,.2,.6)}
}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='close')select({kind:'none'});
  else if(a==='build')doBuild(b.dataset.type);
  else if(a==='up')doUp();
  else if(a==='egg')doEgg();
  else if(a==='pat')doPat();
  else if(a==='seld')select({kind:'dragon',id:+b.dataset.id});
  else if(a==='selv')select({kind:'vil',i:+b.dataset.i});
  else if(a==='rp'){const id=+b.dataset.id;raidPick.has(id)?raidPick.delete(id):raidPick.add(id);renderPanel()}
  else if(a==='rpall'){S.dragons.filter(d=>stageOf(d)>=1&&!raidOf(d.id)&&!(d.hurt>0)).forEach(d=>raidPick.add(d.id));renderPanel()}
  else if(a==='send')doSend();
  else if(a==='reset'){if(b.dataset.armed){try{localStorage.removeItem(KEY)}catch(x){}S=freshState();dragons.forEach(D=>scene.remove(D.m.g));dragons.clear();knights.splice(0).forEach(k=>scene.remove(k.m.g));for(let i=0;i<GRID*GRID;i++)placeTile(i,false);refreshLand();vilObjs.forEach((_,i)=>refreshVillage(i));cam.gx=cam.gz=0;cam.zg=1;syncDragons();select({kind:'none'});save()}
    else{b.dataset.armed=1;b.textContent='Tap again to erase your hoard';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Start over'}},3500)}}
});
$('#bannerBtn').addEventListener('click',()=>scorch(nearestKnight()));

/* --- pointer input */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function setRay(e){const r=cv.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera)}
function pickAt(e){
  setRay(e);
  let h=ray.intersectObjects(knights.filter(k=>!k.dead).map(k=>k.m.hit),false);if(h.length)return{kind:'knight',k:h[0].object.userData.knight};
  h=ray.intersectObjects([...dragons.values()].map(D=>D.m.hit),false);if(h.length)return{kind:'dragon',id:h[0].object.userData.dragon};
  h=ray.intersectObjects(vilObjs.map(v=>v.hit),false);if(h.length)return{kind:'vil',i:h[0].object.userData.vil};
  h=ray.intersectObjects(pickTiles.filter(m=>isOpen(m.userData.tile)),false);if(h.length)return{kind:'tile',i:h[0].object.userData.tile};
  return null;
}
const ptrs=new Map();let drag=null,pinch=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={id:e.pointerId,moved:0};if(ptrs.size===2){pinch=pdist();drag.moved=99}});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return}
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const d=pdist();if(pinch)cam.zoom=clamp(cam.zoom*pinch/d,.4,2.2);cam.zg=null;pinch=d;return}
  if(drag){drag.moved+=Math.abs(dx)+Math.abs(dy);if(drag.moved>8){cam.yaw-=dx*.006;cam.pitch=clamp(cam.pitch+dy*.004,.25,1.3)}}
});
cv.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;
  if(drag&&drag.id===e.pointerId&&drag.moved<=8&&ptrs.size===0)click(e);
  if(ptrs.size===0)drag=null;
});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=clamp(cam.zoom*Math.exp(e.deltaY*.0012),.4,2.2);cam.zg=null},{passive:false});
function hover(e){if(e.pointerType==='touch')return;const h=pickAt(e);cv.classList.toggle('pointer',!!h);
  if(h&&h.kind==='tile'){const p=tilePos(h.i);hovFrame.position.set(p.x,.17,p.z);hovFrame.visible=true}else hovFrame.visible=false}
function click(e){
  const h=pickAt(e);
  if(!h){select({kind:'none'});return}
  if(h.kind==='knight'){scorch(h.k);return}
  if(h.kind==='dragon'){const d=S.dragons.find(x=>x.id===h.id);select({kind:'dragon',id:h.id});if(d)patDragon(d);return}
  if(h.kind==='vil'){select({kind:'vil',i:h.i});return}
  select({kind:'tile',i:h.i});
}

/* ------------------------------------------------------------------ main loop */
for(let i=0;i<GRID*GRID;i++)placeTile(i,false);
buildVillages();refreshLand(true);
syncDragons();
{const a=(Date.now()-(S.ts||Date.now()))/1000;if(a>20)setTimeout(()=>away(a),600)}
resize();renderPanel();

let last=performance.now(),hudT=0,panT=0,saveT=0,floatT=0,T=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sim(dt){
  S.t+=dt;const r=calc();
  S.gold+=r.gold*dt;S.total+=r.gold*dt;
  for(const d of S.dragons)d.age+=dt*(r.fedIds.has(d.id)?1:.2);
  for(let i=0;i<GRID*GRID;i++){const t=S.tiles[i];if(t&&t.egg){t.egg.t+=dt;if(t.egg.t>=t.egg.dur)hatch(i)}}
  stepRaids(dt);
  if(S.vil.every(v=>v.won)&&!S.emperor){S.emperor=true;S.armyIn=70;const dc=$('#decree');dc.classList.remove('on');void dc.offsetWidth;dc.classList.add('on');toast('You are the Dragon Emperor. Royal armies will come for your hoard.','rare')}
  if(S.emperor){if(S.armyIn==null)S.armyIn=120;S.armyIn-=dt;
    if(S.armyIn<=0){if(knights.length)S.armyIn=8;else{S.wave=(S.wave||0)+1;spawnKnights(true);S.armyIn=rnd(150,210);if(sel.kind==='none')renderPanel()}}}
  if(S.revoltIn==null)S.revoltIn=150;S.revoltIn-=dt;
  if(S.revoltIn<=0){S.revoltIn=rnd(110,190);
    const cand=S.vil.map((v,i)=>i).filter(i=>S.vil[i].won&&!S.vil[i].rebel&&!S.raids.some(r=>r.v===i)&&S.t-(S.vil[i].t0||0)>90);
    if(cand.length){if(Math.random()<Math.min(.7,.09*lvlSum('tower')))toast('Your watchtower garrison snuffed out a rebellion before it started.','good');
      else{const i=pick(cand);S.vil[i].rebel=true;refreshVillage(i);const vp=vilObjs[i].g.position;burst(new THREE.Vector3(vp.x,vp.y+1.5,vp.z),40,1,.3,.1,3,.4,1);
        toast(`${VIL[i].name} is in revolt! Its tribute has stopped.`,'bad');renderPanel()}}}
  S.knightIn-=dt;
  if(S.knightIn<=0&&!knights.length){spawnKnights();S.knightIn=rnd(55,95)}
  else if(S.knightIn<=0)S.knightIn=5;
  floatT+=dt;if(floatT>2.2&&S.dragons.length){floatT=0;const d=pick(S.dragons),D=dragons.get(d.id);if(D){const inc=r.per.get(d.id)*2.2;const p=D.m.g.position.clone();p.y+=1*D.cur;floatAt('+'+fmt(inc),p,'')}}
  return r;
}
function hud(r){
  $('#hGold').textContent=fmt(S.gold);$('#hInc').textContent='+'+f1(r.gold)+'/s';
  const hung=Math.max(0,S.dragons.length-r.cap);$('#hMeat').textContent=Math.min(S.dragons.length,r.cap)+'/'+S.dragons.length;$('#hMeatR').textContent=hung?hung+' hungry':'';$('#chipMeat').classList.toggle('neg',hung>0);
  $('#hDr').textContent=S.dragons.length;$('#hDrCap').textContent='of '+roostIdx().length*2;
  const ri=rankIdx(),nx=RANKS[ri+1];$('#hRank').textContent=RANKS[ri][1];$('#hRankBar').style.width=(nx?clamp((S.total-RANKS[ri][0])/(nx[0]-RANKS[ri][0]),0,1)*100:100)+'%';
  const kn=knights.filter(k=>!k.dead&&!k.burning);const bn=$('#banner');
  if(kn.length){bn.hidden=false;const k=nearestKnight()||kn[0];const secs=Math.max(0,Math.ceil((1-k.p)*k.len/k.sp));$('#bannerTxt').textContent=`${kn.some(k=>k.army)?'Royal army: ':''}${kn.length} knight${kn.length>1?'s':''} at the gate · ${secs}s`}else bn.hidden=true;
}
function anim(dt,t){
  for(const d of S.dragons){const D=dragons.get(d.id);if(D)animDragon(D,d,t,dt)}
  // buildings pop-in + life
  for(let i=0;i<GRID*GRID;i++){const g=tileGroups[i];if(!g)continue;
    if(g.userData.pop<1){g.userData.pop=Math.min(1,g.userData.pop+dt*2.6);const k=g.userData.pop,c1=1.70158,c3=c1+1;const e=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);g.scale.setScalar(Math.max(.01,e))}
    const tl=S.tiles[i];
    if(tl.type==='hatchery'){const egg=g.getObjectByName('egg');if(egg){egg.visible=!!tl.egg;if(tl.egg){const f=tl.egg.t/tl.egg.dur;egg.rotation.z=Math.sin(t*(6+f*14))*.12*(.3+f);egg.position.y=.98+Math.sin(t*3)*.03;}}}
    if(tl.type==='tower'){const f=g.getObjectByName('flag');if(f)f.rotation.y=Math.sin(t*4)*.4}
    if(tl.type==='pasture')g.children.forEach(c=>{if(c.userData.sheep!==undefined){c.position.y=Math.abs(Math.sin(t*2+c.userData.sheep*1.7))*.03;c.rotation.y+=Math.sin(t*.5+c.userData.sheep)*.004}});
  }
  for(const rd of S.raids){const k=rd.t/rd.dur;if(k>.3&&k<.75){const vo=vilObjs[rd.v];for(let j=0;j<2;j++){const h=pick(vo.hp);spawn(vo.g.position.x+h.x+rnd(-.3,.3),vo.g.position.y+.4,vo.g.position.z+h.z+rnd(-.3,.3),rnd(-.3,.3),rnd(1.5,3),rnd(-.3,.3),rnd(.6,1.1),rnd(.7,1.1),1,.55,.15,0,0)}}}
  vilObjs.forEach((vo,i)=>{if(S.vil[i].rebel&&Math.random()<dt*14){const h=pick(vo.hp);spawn(vo.g.position.x+h.x+rnd(-.3,.3),vo.g.position.y+.5,vo.g.position.z+h.z+rnd(-.3,.3),rnd(-.2,.2),rnd(1.2,2.4),rnd(-.2,.2),rnd(.6,1),rnd(.6,.9),1,.35,.1,0,0)}
    if(S.vil[i].won&&!S.vil[i].rebel&&Math.random()<dt*6){const h=pick(vo.hp);spawn(vo.g.position.x+h.x,vo.g.position.y+.8,vo.g.position.z+h.z,rnd(-.2,.2),rnd(.5,1.1),rnd(-.2,.2),rnd(2,4),.14,1,.45,.15,0,1)}});
  isl.cur=lerp(isl.cur,isl.target,Math.min(1,dt*1.2));island.scale.set(isl.cur/9.8,1,isl.cur/9.8);
  // hoard
  const gs=.75+Math.min(1.2,Math.log10(Math.max(10,S.gold))*.2);hoardScale=lerp(hoardScale,gs,Math.min(1,dt*1.5));
  const pile=hoard.getObjectByName('pile');pile.scale.set(hoardScale,hoardScale*1.1,hoardScale);pile.position.y=.2+.5*hoardScale*1.1;
  hoardLight.intensity=1+Math.sin(t*3)*.15+hoardScale*.4;lavaLight.intensity=2.3+Math.sin(t*1.7)*.35+Math.sin(t*5.3)*.15;
  window.__bits.forEach(b=>{b.position.y=b.userData.y+Math.sin(t*b.userData.sp+b.userData.ph)*.6;b.rotation.y+=dt*.1});
  window.__clouds.forEach(c=>{c.userData.a+=c.userData.s*dt;c.position.x=Math.cos(c.userData.a)*c.userData.d;c.position.z=Math.sin(c.userData.a)*c.userData.d});
  // frames & marker
  const pulse=.65+.35*Math.sin(t*4);selFrame.material.opacity=pulse;
  if(sel.kind==='dragon'){const D=dragons.get(sel.id);if(D){selMarker.position.copy(D.m.g.position);selMarker.position.y+=1.5*D.cur+.5+Math.sin(t*4)*.1;selMarker.rotation.y=t*2}else selMarker.visible=false}
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>2){away(dt);dt=.05}
  dt=Math.min(dt,.1);T+=dt;
  const r=sim(dt);
  hudT+=dt;if(hudT>.12){hudT=0;hud(r)}
  panT+=dt;if(panT>.25){panT=0;tickPanel()}
  saveT+=dt;if(saveT>8){saveT=0;save()}
  cam.tx=lerp(cam.tx,cam.gx,Math.min(1,dt*3));cam.tz=lerp(cam.tz,cam.gz,Math.min(1,dt*3));if(cam.zg!==null){cam.zoom=lerp(cam.zoom,cam.zg,Math.min(1,dt*3));if(Math.abs(cam.zoom-cam.zg)<.01)cam.zg=null}
  placeCam();
  anim(dt,T);updBreaths(dt);updKnights(dt,T);updParticles(dt);
  updLabels();renderer.render(scene,camera);
}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
setTimeout(()=>toast('Welcome to Wyrmhold. Build a hatchery, buy an egg, and keep the dragons fed.','good'),400);
requestAnimationFrame(frame);
window.__wy={S:()=>S,select,spawnKnights,cam,syncDragons,tilePos};
})();
</script>

</body></html>
