<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Toy Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: a fixed illustrated child's bedroom fills the screen; a large ledger panel of every toy sits in front of it and scrolls in both directions. */
:root{
  --wall:#bfe0f0; --wall-stripe:#a9d3e8; --wainscot:#f2c6d4; --floor:#d9a86c; --floor-line:#c08f55;
  --sky:#8fd0f5; --glow:#ffd45e; --curtain:#ef8a7a; --rug:#7fc8a9; --rug2:#fff1b8;
  --bed:#6fa3d8; --bed2:#ffffff; --wood:#b9824a; --toy1:#ef6f6c; --toy2:#ffd45e; --toy3:#5cc2a0;
  --panel:rgba(255,255,255,.93); --fg:#26324a; --muted:#5d6b86; --line:#d6dff0; --head:#26324a; --headfg:#ffffff;
  --row-alt:#f1f6fd; --accent:#ef6f6c; --accent-fg:#ffffff; --chip:#e4f4ee; --chip-fg:#1d6b52;
  --warn:#fff0c9; --warn-fg:#7a5200; --bad:#fde3e1; --bad-fg:#9a2b25;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#1f2850; --wall-stripe:#252f5e; --wainscot:#4a3560; --floor:#3b2f4c; --floor-line:#2f253d;
  --sky:#0f1a3d; --glow:#fff1b0; --curtain:#8a4a74; --rug:#2f6f67; --rug2:#5b5a86;
  --bed:#3f5fa0; --bed2:#aab6dd; --wood:#6a4a3a; --toy1:#c9585a; --toy2:#e8c04a; --toy3:#3da184;
  --panel:rgba(22,27,52,.92); --fg:#e8ecfa; --muted:#a3aed0; --line:#36406e; --head:#0f1432; --headfg:#e8ecfa;
  --row-alt:#1c2348; --accent:#ff8a85; --accent-fg:#2a1020; --chip:#1f4a43; --chip-fg:#aef0d8;
  --warn:#4d3d12; --warn-fg:#ffe29a; --bad:#5a2230; --bad-fg:#ffc2c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#1f2850; --wall-stripe:#252f5e; --wainscot:#4a3560; --floor:#3b2f4c; --floor-line:#2f253d;
  --sky:#0f1a3d; --glow:#fff1b0; --curtain:#8a4a74; --rug:#2f6f67; --rug2:#5b5a86;
  --bed:#3f5fa0; --bed2:#aab6dd; --wood:#6a4a3a; --toy1:#c9585a; --toy2:#e8c04a; --toy3:#3da184;
  --panel:rgba(22,27,52,.92); --fg:#e8ecfa; --muted:#a3aed0; --line:#36406e; --head:#0f1432; --headfg:#e8ecfa;
  --row-alt:#1c2348; --accent:#ff8a85; --accent-fg:#2a1020; --chip:#1f4a43; --chip-fg:#aef0d8;
  --warn:#4d3d12; --warn-fg:#ffe29a; --bad:#5a2230; --bad-fg:#ffc2c0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--wall);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
#room{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1;margin:0;color:var(--fg);text-wrap:balance;
  background:var(--panel);padding:10px 20px 12px;border-radius:18px 18px 18px 4px}
h1 small{display:block;font-family:var(--font-body);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.theme{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;background:var(--panel);color:var(--fg);cursor:pointer}
.panel{background:var(--panel);border-radius:18px;box-shadow:0 10px 30px rgba(10,20,50,.25);min-width:0;backdrop-filter:blur(3px)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px}
.controls input,.controls select{font:inherit;color:var(--fg);background:var(--row-alt);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.controls input{flex:1 1 220px}
.count{margin-left:auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.stat{font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--chip-fg);font-variant-numeric:tabular-nums}
.wrap{overflow:auto;max-height:68vh;border-top:2px solid var(--line);border-radius:0 0 18px 18px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px}
th,td{padding:9px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--headfg);font-family:var(--font-display);font-weight:600;font-size:.9rem;letter-spacing:.03em;cursor:pointer;user-select:none}
thead th:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
thead th .ar{opacity:.5;margin-left:4px;font-size:.75em}
thead th[aria-sort] .ar{opacity:1;color:var(--glow)}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr:hover{background:var(--chip)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.id{color:var(--muted);font-variant-numeric:tabular-nums}
td.name{font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--chip);color:var(--chip-fg)}
.pill.warn{background:var(--warn);color:var(--warn-fg)}
.pill.bad{background:var(--bad);color:var(--bad-fg)}
.stars{letter-spacing:2px;color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);font-weight:700}
@media (max-width:520px){body{padding-block-start:16px}.count{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
</style>

<svg id="room" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- wall -->
  <rect width="1600" height="640" fill="var(--wall)"/>
  <g fill="var(--wall-stripe)"><rect x="0" width="100" height="640"/><rect x="200" width="100" height="640"/><rect x="400" width="100" height="640"/><rect x="600" width="100" height="640"/><rect x="800" width="100" height="640"/><rect x="1000" width="100" height="640"/><rect x="1200" width="100" height="640"/><rect x="1400" width="100" height="640"/></g>
  <rect y="470" width="1600" height="170" fill="var(--wainscot)"/>
  <rect y="462" width="1600" height="12" fill="var(--bed2)" opacity=".8"/>
  <!-- floor -->
  <rect y="640" width="1600" height="260" fill="var(--floor)"/>
  <g stroke="var(--floor-line)" stroke-width="3"><path d="M0 700H1600M0 770H1600M0 840H1600"/><path d="M300 640V700M900 640V700M1400 640V700M120 700V770M620 700V770M1180 700V770M420 770V840M1000 770V840M1500 770V840"/></g>
  <rect y="634" width="1600" height="10" fill="var(--wood)"/>
  <!-- window -->
  <g transform="translate(640 90)">
    <rect width="330" height="330" rx="14" fill="var(--bed2)"/>
    <rect x="16" y="16" width="298" height="298" rx="6" fill="var(--sky)"/>
    <circle cx="230" cy="90" r="42" fill="var(--glow)"/>
    <g fill="var(--bed2)" opacity=".9"><ellipse cx="90" cy="220" rx="60" ry="22"/><ellipse cx="130" cy="205" rx="40" ry="22"/></g>
    <g fill="var(--glow)"><circle class="twinkle" cx="60" cy="60" r="4"/><circle class="twinkle" cx="150" cy="40" r="3"/><circle class="twinkle" cx="120" cy="120" r="3"/></g>
    <path d="M165 16V314M16 165H314" stroke="var(--bed2)" stroke-width="12"/>
    <rect x="-14" y="326" width="358" height="16" rx="6" fill="var(--bed2)"/>
    <path d="M-40 -10H40V300Q0 330 -40 300Z" fill="var(--curtain)"/><path d="M290 -10H370V300Q330 330 290 300Z" fill="var(--curtain)"/>
    <rect x="-50" y="-22" width="430" height="14" rx="7" fill="var(--wood)"/>
  </g>
  <!-- string lights -->
  <path d="M0 40Q200 120 400 50T800 50T1200 50T1600 40" stroke="var(--wood)" stroke-width="3" fill="none"/>
  <g><circle cx="100" cy="82" r="9" fill="var(--toy2)"/><circle cx="260" cy="104" r="9" fill="var(--toy1)"/><circle cx="420" cy="62" r="9" fill="var(--toy3)"/><circle cx="560" cy="48" r="9" fill="var(--toy2)"/><circle cx="1050" cy="52" r="9" fill="var(--toy1)"/><circle cx="1210" cy="62" r="9" fill="var(--toy3)"/><circle cx="1360" cy="84" r="9" fill="var(--toy2)"/><circle cx="1500" cy="70" r="9" fill="var(--toy1)"/></g>
  <!-- wall stars + banner -->
  <g fill="var(--glow)"><path d="M1140 200l14 30 32 4-24 22 7 32-29-17-29 17 7-32-24-22 32-4z"/><path d="M1380 300l9 19 21 3-15 14 4 21-19-11-19 11 4-21-15-14 21-3z"/></g>
  <!-- bed -->
  <g transform="translate(40 400)">
    <rect x="0" y="40" width="30" height="270" rx="8" fill="var(--wood)"/>
    <rect x="30" y="170" width="470" height="120" rx="14" fill="var(--bed)"/>
    <rect x="30" y="140" width="470" height="50" rx="14" fill="var(--bed2)"/>
    <ellipse cx="90" cy="140" rx="70" ry="30" fill="var(--bed2)" stroke="var(--line)" stroke-width="4"/>
    <path d="M200 190h300v100H200z" fill="var(--bed)"/><g fill="var(--bed2)" opacity=".8"><circle cx="260" cy="230" r="9"/><circle cx="340" cy="250" r="9"/><circle cx="420" cy="225" r="9"/></g>
    <rect x="490" y="120" width="30" height="190" rx="8" fill="var(--wood)"/>
    <rect x="20" y="290" width="14" height="30" fill="var(--wood)"/><rect x="486" y="290" width="14" height="30" fill="var(--wood)"/>
    <ellipse cx="150" cy="120" rx="34" ry="30" fill="var(--toy2)"/><circle cx="140" cy="114" r="4" fill="var(--wood)"/><circle cx="162" cy="114" r="4" fill="var(--wood)"/>
  </g>
  <!-- bookshelf -->
  <g transform="translate(1130 360)">
    <rect width="300" height="290" rx="8" fill="var(--wood)"/>
    <rect x="12" y="12" width="276" height="120" fill="var(--wall)"/><rect x="12" y="150" width="276" height="128" fill="var(--wall)"/>
    <g><rect x="28" y="40" width="26" height="92" fill="var(--toy1)"/><rect x="58" y="56" width="22" height="76" fill="var(--toy3)"/><rect x="84" y="32" width="28" height="100" fill="var(--toy2)"/><rect x="116" y="60" width="20" height="72" fill="var(--bed)"/>
    <rect x="190" y="70" width="64" height="62" rx="8" fill="var(--toy3)"/><circle cx="222" cy="52" r="20" fill="var(--toy3)"/><circle cx="214" cy="48" r="3" fill="var(--wood)"/><circle cx="230" cy="48" r="3" fill="var(--wood)"/>
    <rect x="30" y="206" width="70" height="72" fill="var(--toy2)"/><rect x="100" y="224" width="70" height="54" fill="var(--toy1)"/><rect x="180" y="190" width="90" height="88" rx="8" fill="var(--bed)"/><path d="M190 190l35-30 35 30z" fill="var(--toy1)"/></g>
  </g>
  <!-- rug and floor toys -->
  <ellipse cx="800" cy="790" rx="520" ry="80" fill="var(--rug)"/><ellipse cx="800" cy="790" rx="420" ry="58" fill="none" stroke="var(--rug2)" stroke-width="10" stroke-dasharray="26 18"/>
  <g transform="translate(520 740)"><rect width="46" height="46" rx="6" fill="var(--toy1)"/><text x="23" y="34" font-family="Fredoka,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="var(--bed2)">A</text></g>
  <g transform="translate(580 760)"><rect width="46" height="46" rx="6" fill="var(--toy2)"/><text x="23" y="34" font-family="Fredoka,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="var(--wood)">B</text></g>
  <g transform="translate(550 705) rotate(-8)"><rect width="46" height="46" rx="6" fill="var(--toy3)"/><text x="23" y="34" font-family="Fredoka,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="var(--bed2)">C</text></g>
  <g transform="translate(1030 770)"><circle r="34" fill="var(--toy1)"/><path d="M-34 0H34" stroke="var(--bed2)" stroke-width="6"/><circle r="10" fill="var(--bed2)"/></g>
  <g transform="translate(1110 800)"><rect x="-50" y="-22" width="100" height="28" rx="6" fill="var(--bed)"/><circle cx="-26" cy="10" r="12" fill="var(--wood)"/><circle cx="26" cy="10" r="12" fill="var(--wood)"/><rect x="-10" y="-46" width="40" height="26" rx="4" fill="var(--toy2)"/></g>
</svg>

<main>
  <header>
    <h1>Toy Box<small>Every toy in the bedroom, 96 and counting</small></h1>
    <button class="theme" id="themeBtn" type="button">Switch to night</button>
  </header>
  <section class="panel" aria-label="Toy table">
    <div class="controls">
      <input id="q" type="search" placeholder="Search toys, shelves or colours" aria-label="Search toys">
      <select id="cat" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="where" aria-label="Filter by location"><option value="">All locations</option></select>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="wrap" tabindex="0" aria-label="Scrollable toy table">
      <table id="tbl">
        <thead><tr id="hr"></tr></thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No toys match. Clear the search or pick another shelf.</div>
    </div>
  </section>
</main>

<script>
(function(){
  var base=[
   ["Wooden Train Set","Vehicles"],["Dino Stampede Herd","Animals"],["Rainbow Stacking Rings","Baby & Toddler"],["Castle Building Blocks","Building"],
   ["Plush Narwhal","Plush"],["Teddy Bear (Biscuit)","Plush"],["Bunny Rabbit (Mr. Flops)","Plush"],["Magnetic Tiles","Building"],
   ["Art Easel","Arts & Crafts"],["Washable Markers","Arts & Crafts"],["Play-Dough Tubs","Arts & Crafts"],["Glitter Glue Set","Arts & Crafts"],
   ["Fire Engine","Vehicles"],["Garbage Truck","Vehicles"],["Remote Control Car","Vehicles"],["Toy Kitchen","Pretend Play"],
   ["Doctor Kit","Pretend Play"],["Tea Party Set","Pretend Play"],["Pirate Costume","Dress-up"],["Fairy Wings","Dress-up"],
   ["Astronaut Helmet","Dress-up"],["Jigsaw: Ocean (48 pc)","Puzzles"],["Jigsaw: Farm (24 pc)","Puzzles"],["Floor Puzzle: Map","Puzzles"],
   ["Memory Card Game","Games"],["Snakes & Ladders","Games"],["Dominoes","Games"],["Xylophone","Music"],
   ["Ukulele (Mini)","Music"],["Shaker Eggs","Music"],["Picture Book Pile","Books"],["Bedtime Stories Box","Books"],
   ["Marble Run","Building"],["Dollhouse","Pretend Play"],["Dollhouse Furniture","Pretend Play"],["Farm Animal Set","Animals"],
   ["Ocean Animal Set","Animals"],["Balance Bike","Outdoor"],["Bubble Wand","Outdoor"],["Sidewalk Chalk","Outdoor"],
   ["Kite","Outdoor"],["Soccer Ball (Size 3)","Outdoor"],["Skipping Rope","Outdoor"],["Water Table","Outdoor"],
   ["Lego Bricks (Big Tub)","Building"],["Duplo Zoo","Building"],["Robot Buddy","Electronic"],["Talking Globe","Electronic"],
   ["Night Light Turtle","Electronic"],["Kids Camera","Electronic"],["Sticker Albums","Arts & Crafts"],["Puppet Theatre","Pretend Play"]];
  var spots=["Under the bed","Bookshelf, top","Bookshelf, bottom","Window seat","Toy chest","Closet floor","Reading corner","Rug basket","Desk drawer","Hallway bin"];
  var cond=["Like new","Good","Well loved","Needs repair","Missing pieces"];
  var months=["Sep","Oct","Nov"];
  var seed=7;function r(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
  var rows=[];
  for(var i=0;i<96;i++){
    var b=base[i%base.length], v=i>=base.length?" #2":"";
    var c=r(); var cd=c<.3?0:c<.6?1:c<.85?2:c<.93?3:4;
    var d=1+Math.floor(r()*28), m=months[Math.floor(r()*3)];
    rows.push({id:i+1,name:b[0]+v,cat:b[1],where:spots[Math.floor(r()*spots.length)],
      pieces:b[1]==="Building"?20+Math.floor(r()*380):1+Math.floor(r()*24),
      age:[0,1,2,3,3,4,5,6][Math.floor(r()*8)]+(b[1]==="Baby & Toddler"?0:1),
      cond:cd,fav:1+Math.floor(r()*5),last:(m==="Sep"?0:m==="Oct"?1:2)*31+d,
      lastTxt:d+" "+m, value:Math.round((4+r()*46)*2)/2});
  }
  var cols=[
    {k:"id",t:"#",cls:"num"},{k:"name",t:"Toy"},{k:"cat",t:"Category"},{k:"where",t:"Lives in"},
    {k:"pieces",t:"Pieces",cls:"num"},{k:"age",t:"Age",cls:"num",fmt:function(x){return x+"+"}},
    {k:"cond",t:"Condition",fmt:function(x,o){var cls=x>=4?"bad":x==3?"warn":"";return '<span class="pill '+cls+'">'+cond[x]+'</span>'},html:1},
    {k:"fav",t:"Favourite",fmt:function(x){return '<span class="stars" aria-label="'+x+' of 5">'+"★".repeat(x)+"☆".repeat(5-x)+'</span>'},html:1},
    {k:"last",t:"Last played",fmt:function(x,o){return o.lastTxt}},
    {k:"value",t:"Value ($)",cls:"num",fmt:function(x){return x.toFixed(2)}}];
  var hr=document.getElementById("hr"),tb=document.getElementById("tb"),q=document.getElementById("q"),
      cat=document.getElementById("cat"),where=document.getElementById("where"),empty=document.getElementById("empty");
  var sort={k:"id",dir:1};
  function uniq(k){var s={};rows.forEach(function(o){s[o[k]]=1});return Object.keys(s).sort()}
  uniq("cat").forEach(function(v){cat.add(new Option(v,v))});uniq("where").forEach(function(v){where.add(new Option(v,v))});
  cols.forEach(function(c){
    var th=document.createElement("th");th.scope="col";th.tabIndex=0;th.className=c.cls||"";
    th.innerHTML=c.t+'<span class="ar">▲▼</span>';
    function go(){sort=sort.k===c.k?{k:c.k,dir:-sort.dir}:{k:c.k,dir:1};render()}
    th.onclick=go;th.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
    c.th=th;hr.appendChild(th);
  });
  function esc(s){return String(s).replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
  function render(){
    var t=q.value.toLowerCase().trim();
    var list=rows.filter(function(o){
      return (!cat.value||o.cat===cat.value)&&(!where.value||o.where===where.value)&&
        (!t||(o.name+" "+o.cat+" "+o.where+" "+cond[o.cond]).toLowerCase().indexOf(t)>-1)});
    list.sort(function(a,b){var x=a[sort.k],y=b[sort.k];return (x>y?1:x<y?-1:0)*sort.dir});
    cols.forEach(function(c){var on=c.k===sort.k;if(on)c.th.setAttribute("aria-sort",sort.dir>0?"ascending":"descending");else c.th.removeAttribute("aria-sort");
      c.th.querySelector(".ar").textContent=on?(sort.dir>0?"▲":"▼"):"▲▼"});
    tb.innerHTML=list.map(function(o){
      return "<tr>"+cols.map(function(c){var v=c.fmt?c.fmt(o[c.k],o):esc(o[c.k]);
        return '<td class="'+(c.cls||"")+(c.k==="id"?" id":"")+(c.k==="name"?" name":"")+'">'+v+"</td>"}).join("")+"</tr>"}).join("");
    empty.hidden=list.length>0;
    document.getElementById("count").textContent=list.length+" of "+rows.length+" toys";
    var pcs=0,val=0,fix=0;list.forEach(function(o){pcs+=o.pieces;val+=o.value;if(o.cond>=3)fix++});
    document.getElementById("stats").innerHTML='<span class="stat">'+pcs.toLocaleString()+' pieces</span><span class="stat">$'+val.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' total value</span><span class="stat">'+fix+' need attention</span>';
  }
  q.oninput=cat.onchange=where.onchange=render;render();
  var btn=document.getElementById("themeBtn"),root=document.documentElement;
  function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
  function label(){btn.textContent=isDark()?"Switch to day":"Switch to night"}
  btn.onclick=function(){root.setAttribute("data-theme",isDark()?"light":"dark");label()};label();
})();
</script>

</body></html>
