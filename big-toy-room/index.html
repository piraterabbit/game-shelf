<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

:root{

}
:root[data-theme="dark"]{--bg:#15121c;--fg:#f6eee8;--muted:#b9acc4;--panel:rgba(30,25,40,.9);--line:rgba(255,255,255,.2);--accent:#ff6a55;--accent-fg:#1a0f10;color-scheme:dark}
html,body{height:100%}

#app{position:relative;height:100%;overflow:hidden}

.layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.title{align-self:flex-start;padding:10px 16px 11px;max-width:min(100%,420px)}
.title h1{margin:0;font:700 clamp(22px,4vw,30px)/1.1 var(--display);letter-spacing:.01em;text-wrap:balance}

<div id="app">

<script>
(function(){
const T=THREE;
const app=document.getElementById('app');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- random ---------- */

const BC=['#ef476f','#ffd166','#06d6a0','#118ab2','#8338ec','#ff7a00','#4cc9f0'];

let renderer;

const scene=new T.Scene();
const dayBg=new T.Color('#bfe3ff'),nightBg=new T.Color('#0c1030');
scene.background=dayBg.clone();
const camera=new T.PerspectiveCamera(50,1,.1,300);

/* ---------- helpers ---------- */
const gc={};const G=(k,f)=>gc[k]||(gc[k]=f());

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}t.anisotropy=4;return t}

const faceCenter=(x,z)=>Math.atan2(-x,-z);

/* ---------- placement bookkeeping ---------- */
const blocked=[];
function ok(x,z,rad){
  if(x<-20||x>20.5||z<-20||z>20.8)return false;
  for(const b of blocked){
    if(b.r!==undefined){if(Math.hypot(x-b.x,z-b.z)<b.r+rad)return false}

  if(d>.78&&d<1.22)return false;

}
function scatter(n,make,opt){

    tries++;const s=R(sc[0],sc[1])*.6,x=R(-20,20.5),z=R(-20,20.8);
    if(!ok(x,z,rad*s))continue;

/* ---------- textures ---------- */
const floorTex=canvasTex(512,512,(g,w,h)=>{
  const rows=8,bh=h/rows;
  for(let r=0;r<rows;r++){let x=-((r*137)%200);
    while(x<w){const bw=170+Math.abs((x*7+r*53)%130),l=52+Math.abs((r*31+x*17)%11);
      g.fillStyle='hsl(30,'+(44+(r%3)*4)+'%,'+l+'%)';g.fillRect(x,r*bh,bw-2,bh-2);
      g.fillStyle='rgba(90,50,20,.08)';for(let i=0;i<5;i++)g.fillRect(x+4,r*bh+6+i*7,bw-12,1);
      x+=bw}}
},[7,7]);
function wallTex(hex){return canvasTex(128,8,(g,w,h)=>{g.fillStyle='#fff9ef';g.fillRect(0,0,w,h);g.fillStyle=hex;g.fillRect(w/2,0,w/2,h)},[11,1])}
const rugTex=canvasTex(512,512,(g,w,h)=>{
  const cols=['#1d3557','#ffd166','#e63946','#f1faee','#118ab2','#ef476f','#ffd166'];
  for(let i=0;i<cols.length;i++){g.fillStyle=cols[i];g.beginPath();g.arc(w/2,h/2,w/2*(1-i/cols.length),0,7);g.fill()}
  g.fillStyle='#ffd166';const n=10;g.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,r=(i%2?30:78);g.lineTo(w/2+Math.cos(a)*r,h/2+Math.sin(a)*r)}g.fill();
});
const matTex=canvasTex(512,512,(g,w,h)=>{
  const n=8,c=w/n,cols=['#ef476f','#ffd166','#06d6a0','#118ab2'];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){g.fillStyle=cols[(x+y*3)%4];g.fillRect(x*c,y*c,c-3,c-3);
    g.fillStyle='rgba(255,255,255,.9)';g.font='bold 40px Fredoka,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[(x+y*n)%26],x*c+c/2,y*c+c/2+3)}
});
const lm={};
function letterMat(ch,bg){const k=ch+bg;return lm[k]||(lm[k]=new T.MeshStandardMaterial({roughness:.6,map:canvasTex(128,128,(g,w,h)=>{
  g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=8;g.strokeRect(4,4,w-8,h-8);
  g.fillStyle='#231f33';g.font='bold 84px Fredoka,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,w/2,h/2+6)})}))}
function abcBlock(sz,bg,front){
  const mats=[];for(let i=0;i<6;i++)mats.push(letterMat(i===4&&front?front:pick('ABCDEFGHIJKLMNOPRSTUVW'.split('')),bg));
  const m=new T.Mesh(G('bb'+sz,()=>new T.BoxGeometry(sz,sz,sz)),mats);m.castShadow=m.receiveShadow=true;
  const g=new T.Group();m.position.y=sz/2;g.add(m);return g}

/* ---------- toy builders (all face +z, sit on y=0) ---------- */
function teddy(col,belly){
  col=col||'#c68642';belly=belly||'#ecd0a4';const g=new T.Group();
  sph(g,1,col,0,1.15,0,null,1.05,1.1,.9);
  sph(g,.68,belly,0,1.05,.62,null,1,1.1,.5);
  sph(g,.8,col,0,2.55,.05);
  sph(g,.3,col,-.62,3.2,0);sph(g,.3,col,.62,3.2,0);
  sph(g,.16,belly,-.62,3.2,.2);sph(g,.16,belly,.62,3.2,.2);
  sph(g,.36,belly,0,2.38,.7,null,1,.8,.8);
  sph(g,.12,'#2a1a14',0,2.5,1.02);
  sph(g,.09,'#111',-.3,2.78,.72);sph(g,.09,'#111',.3,2.78,.72);
  sph(g,.3,col,-1.05,1.6,.25,null,.9,1.5,.9);sph(g,.3,col,1.05,1.6,.25,null,.9,1.5,.9);
  sph(g,.46,col,-.6,.42,.6,null,1,.9,1.3);sph(g,.46,col,.6,.42,.6,null,1,.9,1.3);
  sph(g,.26,belly,-.6,.44,1.12,null,1,.9,.6);sph(g,.26,belly,.6,.44,1.12,null,1,.9,.6);
  box(g,.4,.3,.14,'#e63946',-.25,1.9,.78);box(g,.4,.3,.14,'#e63946',.25,1.9,.78);sph(g,.12,'#b5202e',0,1.9,.82);
  return g}
function bunny(col){
  col=col||'#f1ece4';const g=new T.Group();
  sph(g,.95,col,0,1.0,0,null,1,1.05,1);
  sph(g,.7,col,0,2.3,.1);
  sph(g,.22,col,-.34,3.45,0,null,.8,3.2,.6);sph(g,.22,col,.34,3.45,0,null,.8,3.2,.6);
  sph(g,.12,'#f4a6b8',-.34,3.45,.1,null,.6,3.0,.5);sph(g,.12,'#f4a6b8',.34,3.45,.1,null,.6,3.0,.5);
  sph(g,.1,'#f07c97',0,2.2,.78);
  sph(g,.08,'#111',-.26,2.45,.62);sph(g,.08,'#111',.26,2.45,.62);
  sph(g,.4,col,0,.9,-.9);
  sph(g,.4,col,-.5,.35,.6,null,1,.8,1.5);sph(g,.4,col,.5,.35,.6,null,1,.8,1.5);
  sph(g,.2,col,-.85,1.3,.4,null,.8,1.6,.8);sph(g,.2,col,.85,1.3,.4,null,.8,1.6,.8);
  const carrot=cone(g,.14,.7,'#ff8c1a',.75,1.0,.75);carrot.rotation.x=Math.PI/2;
  return g}
function duck(){
  const g=new T.Group();
  sph(g,.9,'#ffd23f',0,.85,0,null,1.1,.9,1.25);
  sph(g,.55,'#ffd23f',0,1.9,.55);
  box(g,.5,.14,.45,'#ff8c1a',0,1.78,1.1);
  sph(g,.08,'#111',-.26,2.05,.95);sph(g,.08,'#111',.26,2.05,.95);
  sph(g,.4,'#ffc21a',-.95,.95,-.1,null,.4,.8,1);sph(g,.4,'#ffc21a',.95,.95,-.1,null,.4,.8,1);
  const tail=cone(g,.35,.8,'#ffd23f',0,1.3,-1.2);tail.rotation.x=-Math.PI/2+.5;
  return g}
function dino(){
  const g=new T.Group(),col='#4caf50';
  sph(g,1,col,0,1.7,0,null,1,1,1.6);
  sph(g,.55,col,0,2.5,1.3);
  sph(g,.6,col,0,3.0,1.8,null,.9,.8,1.3);
  sph(g,.1,'#111',-.4,3.15,2.0);sph(g,.1,'#111',.4,3.15,2.0);
  const tail=cone(g,.7,3,col,0,2.07,-2.85);tail.rotation.x=-Math.PI/2+.25;
  [[-.7,.6],[.7,.6],[-.7,-.6],[.7,-.6]].forEach(p=>cyl(g,.36,.36,1.2,'#388e3c',p[0],.6,p[1]));
  for(let i=0;i<5;i++){const z=-1+i*.6;cone(g,.3,.8,'#ff9f1c',0,1.7+Math.sqrt(Math.max(0,1-(z/1.6)*(z/1.6)))+.2,z)}
  return g}
function robot(){
  const g=new T.Group(),met={metalness:.5,roughness:.35},eye={emissive:'#6ff',emissiveIntensity:.9};
  box(g,1.5,1.7,1.0,'#b0b9c6',0,2.0,0,met);
  box(g,.9,.7,.08,'#34495e',0,2.1,.52);
  sph(g,.1,'#ef476f',-.25,2.1,.6);sph(g,.1,'#ffd166',0,2.1,.6);sph(g,.1,'#06d6a0',.25,2.1,.6);
  box(g,1.1,.9,.9,'#cfd8dc',0,3.4,0,met);
  box(g,.25,.18,.06,'#6ff',-.27,3.5,.47,eye);box(g,.25,.18,.06,'#6ff',.27,3.5,.47,eye);
  cyl(g,.05,.05,.5,'#555',0,4.1,0);sph(g,.12,'#ef476f',0,4.4,0);
  box(g,.4,1.5,.45,'#8896a5',-1.0,2.1,0,met);box(g,.4,1.5,.45,'#8896a5',1.0,2.1,0,met);
  box(g,.5,.5,.5,'#ef476f',-1.0,1.2,0);box(g,.5,.5,.5,'#ef476f',1.0,1.2,0);
  box(g,.5,1.0,.5,'#8896a5',-.4,.8,0,met);box(g,.5,1.0,.5,'#8896a5',.4,.8,0,met);
  box(g,.6,.3,.9,'#34495e',-.4,.15,.15);box(g,.6,.3,.9,'#34495e',.4,.15,.15);
  return g}
function rocket(){
  const g=new T.Group();
  cyl(g,.9,1.0,.5,'#555',0,.25,0);cyl(g,.35,.5,.5,'#333',0,.75,0);
  cyl(g,.6,.6,3,'#f4f4f4',0,2.7,0);
  cone(g,.6,1.2,'#e63946',0,4.8,0);
  for(let i=0;i<3;i++){const a=i*Math.PI*2/3,f=box(g,.12,1.4,.9,'#e63946',Math.sin(a)*.8,1.9,Math.cos(a)*.8);f.rotation.y=a}
  sph(g,.3,'#4cc9f0',0,3.2,.55,{emissive:'#1b7fa8',emissiveIntensity:.3},1,1,.5);
  return g}
function car(col){
  const g=new T.Group();col=col||pick(BC);
  box(g,1.2,.6,2.4,col,0,.65,0);box(g,1.0,.5,1.2,col,0,1.15,-.1);
  box(g,1.02,.35,.9,'#bfe6f7',0,1.2,-.1);
  sph(g,.12,'#fff3b0',-.4,.7,1.2);sph(g,.12,'#fff3b0',.4,.7,1.2);
  [[-.62,.8],[.62,.8],[-.62,-.8],[.62,-.8]].forEach(p=>{const w=cyl(g,.38,.38,.28,'#222',p[0],.38,p[1]);w.rotation.z=Math.PI/2});
  return g}
function brick(nx,nz,col){
  const g=new T.Group();box(g,nx*.8,.5,nz*.8,col,0,.25,0);
  for(let i=0;i<nx;i++)for(let j=0;j<nz;j++)mesh(g,G('stud',()=>new T.CylinderGeometry(.22,.22,.2,10)),M(col),(i-(nx-1)/2)*.8,.6,(j-(nz-1)/2)*.8,false);
  return g}
function ball(r,col){const g=new T.Group();sph(g,r,col||pick(BC),0,r,0,{roughness:.35});return g}
function ringStack(){
  const g=new T.Group();cyl(g,1.1,1.2,.25,'#8d5524',0,.12,0);cyl(g,.12,.12,2.8,'#c9a227',0,1.5,0);
  const cols=['#e63946','#ff7a00','#ffd166','#06d6a0','#118ab2'];
  for(let i=0;i<5;i++){const Rr=.95-i*.14,t=mesh(g,G('t'+Rr,()=>new T.TorusGeometry(Rr,.24,10,24)),M(cols[i]),0,.5+i*.42,0);t.rotation.x=Math.PI/2}
  sph(g,.24,'#e63946',0,2.95,0);return g}
function figure(o){
  o=Object.assign({suit:'#1f5fd1',trim:'#e63946',gold:'#ffc233',skin:'#f2c29b',cape:'#e63946',mask:'#e63946',pose:'hero',shield:true},o||{});
  const g=new T.Group(),P={group:g};
  [-1,1].forEach(s=>{
    box(g,.74,1.55,.74,o.suit,s*.47,1.4,0);box(g,.8,.22,.8,o.gold,s*.47,.8,0);box(g,.9,.62,1.25,o.trim,s*.47,.31,.2)});
  box(g,1.95,.55,.95,o.suit,0,2.15,0);box(g,2.0,.3,1.0,o.gold,0,2.5,0);box(g,.45,.4,.12,'#fff3b0',0,2.5,.52);

    const dx=(-Math.sin(th)*iz+Math.cos(th)*ix)/len,dz=(-Math.cos(th)*iz-Math.sin(th)*ix)/len;
    hx=clamp(hx+dx*dt*6,-20.5,20.5);hz=clamp(hz+dz*dt*6,-20.5,20.8);
    for(let pass=0;pass<3;pass++)for(const b of blocked){
      if(b.hero||hy>=(b.h===undefined?1e9:b.h)-.02)continue;
      if(b.r!==undefined){const ox=hx-b.x,oz=hz-b.z,dd=Math.hypot(ox,oz),mn=b.r+.5;if(dd<mn){const nx=dd?ox/dd:1,nz=dd?oz/dd:0;hx=b.x+nx*mn;hz=b.z+nz*mn}}
      else{const hw=b.w/2,hd=b.d/2,qx=clamp(hx,b.x-hw,b.x+hw),qz=clamp(hz,b.z-hd,b.z+hd),ox=hx-qx,oz=hz-qz,dd=Math.hypot(ox,oz);
        if(dd>0&&dd<.5){hx=qx+ox/dd*.5;hz=qz+oz/dd*.5}
        else if(dd===0){const px=hw-Math.abs(hx-b.x),pz=hd-Math.abs(hz-b.z);if(px<pz)hx=b.x+Math.sign(hx-b.x||1)*(hw+.5);else hz=b.z+Math.sign(hz-b.z||1)*(hd+.5)}}
    }
    hx=clamp(hx,-20.5,20.5);hz=clamp(hz,-20.5,20.8);
    let d=Math.atan2(dx,dz)-hero.group.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));hero.group.rotation.y+=d*Math.min(1,dt*12);
    hmove=Math.min(1,hmove+dt*6);
  }else hmove=Math.max(0,hmove-dt*6);
  for(const c of trainCars){const ox=hx-c.position.x,oz=hz-c.position.z,dd=Math.hypot(ox,oz),mn=1.15+.5;if(dd<mn){const nx=dd?ox/dd:1,nz=dd?oz/dd:0;hx=c.position.x+nx*mn;hz=c.position.z+nz*mn}}
  hx=clamp(hx,-20.5,20.5);hz=clamp(hz,-20.5,20.8);
  const w=performance.now()/1000*12;
  let ground=0;
  for(const b of blocked){
    if(b.hero||b.h===undefined||hy<b.h-.02)continue;
    const inside=b.r!==undefined?Math.hypot(hx-b.x,hz-b.z)<b.r+.1:(Math.abs(hx-b.x)<b.w/2+.1&&Math.abs(hz-b.z)<b.d/2+.1);
    if(inside)ground=Math.max(ground,b.h);
  }
  const grounded=hy<=ground+.001&&vy<=0;
  if((jumpReq||keys.j)&&grounded)vy=10.5;
  jumpReq=false;
  if(!grounded||vy>0){vy-=24*dt;hy=Math.max(ground,hy+vy*dt);if(hy===ground&&vy<0)vy=0}else hy=ground;
  const air=hy>ground+.001;
  hero.group.position.set(hx,Math.abs(Math.sin(w))*.5*HS*hmove*(air?0:1)+hy,hz);
  hero.lArm.rotation.x=air?-2.6:Math.sin(w)*.7*hmove;hero.rArm.rotation.z=-2.75+Math.sin(tt*1.2)*.06;
  hero.head.rotation.y=Math.sin(tt*.7)*.2*(1-hmove);
  if(follow){goal.tx=hx;goal.tz=hz}
}
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  if(!reduce){tt+=dt;trainU=(trainU+dt*.02)%1}
  const k=1-Math.exp(-dt*6);
  for(const key in cur)cur[key]+=(goal[key]-cur[key])*k;
  const th=cur.th*Math.PI/180,ph=cur.ph*Math.PI/180;
  camera.position.set(cur.tx+cur.r*Math.sin(ph)*Math.sin(th),Math.max(1.2,cur.ty+cur.r*Math.cos(ph)),cur.tz+cur.r*Math.sin(ph)*Math.cos(th));
  camera.lookAt(cur.tx,cur.ty,cur.tz);
  night+=(nightGoal-night)*(1-Math.exp(-dt*3));applyNight(night);
  placeTrain();
  moveHero(dt);
  hero.flutter(tt);rivals[0].flutter(tt+1);
  mobiles.forEach(m=>{m.item.rotation.y=tt*.6+m.phase;m.item.position.y=-m.L+Math.sin(tt+m.phase)*.25});
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
window.__ready=true;
})();
